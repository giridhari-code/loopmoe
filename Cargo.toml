[package]
name = "loopmoe"
version = "1.0.0"
edition = "2021"
description = "Sentinel v1.0 — Looped MoE inference + recipe API + Rust training"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
candle-core = { version = "0.8", default-features = false }
candle-nn = "0.8"
safetensors = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
half = "2"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
rayon = "1.10"
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

[features]
default = ["cuda"]
cuda = ["candle-core/cuda"]
arm = []
cpu = []
server = ["dep:axum", "dep:tokio", "dep:tower-http"]

[[bin]]
name = "sentinel"
path = "src/main.rs"

[[bin]]
name = "loopmoe"
path = "src/main.rs"

[[bin]]
name = "sentinel-train"
path = "src/bin/sentinel_train.rs"

[[bin]]
name = "sentinel-server"
path = "src/bin/sentinel_server.rs"
required-features = ["server"]

[[example]]
name = "offline_infer"
path = "examples/offline_infer.rs"

[[example]]
name = "recipe_chat"
path = "examples/recipe_chat.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
