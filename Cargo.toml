[package]
name = "loopmoe"
version = "0.1.0"
edition = "2021"
description = "High-performance MoE + Looped Transformer inference — Fertile kernel"
license = "Apache-2.0"

[dependencies]
candle-core = { version = "0.8", default-features = false }
candle-nn = "0.8"
safetensors = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
half = "2"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda"]
arm = []
cpu = []

[[bin]]
name = "loopmoe"
path = "src/main.rs"

[[example]]
name = "offline_infer"
path = "examples/offline_infer.rs"
