stage: pretrain
model:
  model_name: Sentinel-v1.0
  vocab_size: 128256
  hidden_size: 4096
  intermediate_size: 11008
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  num_layers: 8
  loop_count: 24
  n_routed_experts: 64
  n_shared_experts: 2
  num_experts_per_tok: 6
  moe_intermediate_size: 1408
  routed_scaling_factor: 1.0
  scoring_func: softmax
  norm_topk_prob: true
  moe_aux_loss_coef: 0.001
  rope_theta: 500000.0
  rms_norm_eps: 1.0e-5
data:
  path: data/pretrain.jsonl
  tokenizer: gpt2
train:
  max_length: 2048
  batch_size: 1
  grad_accum: 8
  lr: 3.0e-4
  weight_decay: 0.1
  max_steps: 100000
  log_every: 10
  save_every: 1000
  grad_clip: 1.0
  bf16: true
  output_dir: outputs/pretrain
