stage: midtrain
model:
  model_name: Sentinel-v1.0
  vocab_size: 128256
  hidden_size: 4096
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  num_layers: 8
  loop_count: 24
  n_routed_experts: 64
  n_shared_experts: 2
  num_experts_per_tok: 6
  moe_intermediate_size: 1408
  moe_aux_loss_coef: 0.001
data:
  path: data/midtrain.jsonl
  tokenizer: gpt2
train:
  init_from: outputs/pretrain/final
  max_length: 4096
  batch_size: 1
  grad_accum: 8
  lr: 5.0e-5
  max_steps: 20000
  log_every: 10
  save_every: 1000
  bf16: true
  output_dir: outputs/midtrain
